name: CI
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@09f920c3f494642ec47a98cc19eee671027ff74f
    with:
      craft-fonts-ref: 37827adc41fd165f9a9234ac40f94dbad353aa69
      require-craft-fonts: true
      packages: libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
