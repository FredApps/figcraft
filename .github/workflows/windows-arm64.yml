name: Windows ARM64
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-arm64:
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@5cd19d05cb07bb389d82d0e200d9ee5f418f332f
    with:
      app-name: figcraft
      app-dir: FigCraft
      install-relative-path: Programs/ArtCraft/FigCraft
      install-scope: perUser
