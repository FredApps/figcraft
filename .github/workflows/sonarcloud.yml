name: Fig dependency pin scoped Windows validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fig-svg-pin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pin:
    if: github.repository == 'FredApps/figcraft' && github.ref == 'refs/heads/diag/778-svg-pin-8c829863'
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@ecb64b2acb8731f0e2eb8f55fd2f45424bef75d0
    with:
      os: '["windows-latest"]'
      select-os: '[]'
      timeout-minutes: 25
      gate-timeout-minutes: 23
      tools: ''
      targets: ''
      craft-fonts-ref: ''
      require-craft-fonts: false
      cache-name: fig-svg-pin-scoped
      command: |
        git fetch --no-tags origin 8c829863813b9f30928cfb14dc4989eaad00be35
        git diff --exit-code 8c829863813b9f30928cfb14dc4989eaad00be35 HEAD -- . ':(exclude).github/workflows/sonarcloud.yml'
        echo 'Scoped Fig format/pdf/render/svg tests and lint only, not a full-workspace or WASM gate.'
        cargo fmt --all -- --check
        cargo test --locked -p figcraft-svg -p figcraft-format -p figcraft-pdf -p figcraft-render
        cargo clippy --locked -p figcraft-svg -p figcraft-format -p figcraft-pdf -p figcraft-render --all-targets -- -D warnings
