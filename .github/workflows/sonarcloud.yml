name: Fig SVG path consumer scoped Windows validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fig-svg-consumer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  svg:
    if: github.repository == 'FredApps/figcraft' && github.ref == 'refs/heads/diag/778-svg-consumer-5bed2330'
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@ecb64b2acb8731f0e2eb8f55fd2f45424bef75d0
    with:
      os: '["windows-latest"]'
      select-os: '[]'
      timeout-minutes: 20
      gate-timeout-minutes: 18
      tools: ''
      targets: ''
      craft-fonts-ref: ''
      require-craft-fonts: false
      cache-name: fig-svg-pin-scoped
      command: |
        git fetch --no-tags origin 5bed2330fad4c3a7d560f5c50ab75250cb9f59de
        git diff --exit-code 5bed2330fad4c3a7d560f5c50ab75250cb9f59de HEAD -- . ':(exclude).github/workflows/sonarcloud.yml'
        echo 'Scoped Fig SVG unit/corpus tests and lint only, not a full-workspace or WASM gate.'
        cargo fmt -p figcraft-svg -- --check
        cargo test --locked -p figcraft-svg
        cargo clippy --locked -p figcraft-svg --all-targets -- -D warnings
